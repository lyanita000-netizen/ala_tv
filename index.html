
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090611">
  <meta name="description" content="ALA TV - تابع مباريات كرة القدم ومواعيدها ونتائجها وتفاصيلها.">
  <title>ALA TV | مباريات اليوم</title>

  <style>
    :root {
      --bg: #090611;
      --panel: #130e20;
      --panel2: #1b1430;
      --purple: #8b5cf6;
      --purple2: #6d28d9;
      --text: #f7f4ff;
      --muted: #a9a0bb;
      --border: #302343;
      --green: #35d49a;
      --red: #ff6b81;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: radial-gradient(ellipse at top, #21113b 0%, var(--bg) 52%);
      font-family: Arial, Tahoma, sans-serif;
      min-height: 100vh;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; border: 0; }

    .container {
      width: min(1150px, 94%);
      margin: auto;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(9, 6, 17, .88);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(14px);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span { color: var(--purple); }

    .nav button, .secondary-btn {
      color: white;
      background: var(--panel2);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
    }

    .hero {
      text-align: center;
      padding: 35px 0 24px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 5vw, 40px);
    }

    .hero h1 span { color: #b69aff; }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      margin: 22px 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(19, 14, 32, .88);
    }

    .field label {
      display: block;
      color: var(--muted);
      margin-bottom: 8px;
      font-size: 13px;
    }

    .field input, .field select {
      width: 100%;
      min-height: 44px;
      color: white;
      background: #0d0916;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      outline: none;
    }

    .field select option { background: #130e20; }

    .primary-btn {
      align-self: end;
      min-height: 44px;
      padding: 10px 20px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
    }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid #b69aff;
      outline-offset: 3px;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 25px 0 15px;
    }

    .section-head h2 {
      font-size: 20px;
      margin: 0;
    }

    .muted { color: var(--muted); font-size: 13px; }

    .status-message {
      text-align: center;
      padding: 30px 12px;
      border: 1px dashed var(--border);
      border-radius: 15px;
      background: rgba(19, 14, 32, .6);
      color: var(--muted);
      line-height: 1.9;
      margin-bottom: 18px;
    }

    .matches {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding-bottom: 40px;
    }

    .match-card {
      min-width: 0;
      background: linear-gradient(145deg, #171026, #100b1b);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      transition: border-color .2s, transform .2s;
    }

    .match-card:hover {
      border-color: #7651bd;
      transform: translateY(-2px);
    }

    .league {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #c5b5f0;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .league span:first-child { overflow-wrap: anywhere; }

    .teams {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      text-align: center;
    }

    .team { min-width: 0; }

    .team img {
      width: 43px;
      height: 43px;
      object-fit: contain;
      display: block;
      margin: 0 auto 9px;
    }

    .team-name {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .score {
      font-size: 21px;
      font-weight: 900;
      white-space: nowrap;
    }

    .match-time {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .match-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .status { color: var(--muted); font-size: 12px; }
    .status.live { color: var(--red); }
    .status.finished { color: var(--green); }

    .details-btn {
      padding: 8px 12px;
      border-radius: 9px;
      color: white;
      background: #33204e;
      border: 1px solid #493267;
      font-size: 12px;
    }

    .details-btn:hover { background: #493267; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(0, 0, 0, .78);
      padding: 18px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .modal-content {
      width: min(700px, 100%);
      margin: auto;
      background: #110c1d;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .modal-head h2 { font-size: 20px; margin: 0; }

    .close-btn {
      color: white;
      background: #30213f;
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      line-height: 1.7;
    }

    .detail-row span:first-child { color: var(--muted); }
    .detail-row span:last-child {
      text-align: left;
      overflow-wrap: anywhere;
    }

    .detail-section { margin-top: 22px; }

    .detail-section h3 {
      font-size: 16px;
      color: #c7b4ff;
    }

    .channel-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .channel {
      padding: 8px 11px;
      background: #211634;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 13px;
    }

    .lineup-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .lineup-team {
      min-width: 0;
      background: #171026;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .lineup-team h4 { margin: 0 0 10px; }
    .lineup-team ul { margin: 0; padding-right: 20px; color: #ded6ed; }
    .lineup-team li { margin: 7px 0; font-size: 13px; }

    footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      padding: 25px 10px;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .filters { grid-template-columns: 1fr; }
      .matches { grid-template-columns: 1fr; }
      .nav { min-height: 62px; }
      .logo { font-size: 23px; }
      .lineup-list { grid-template-columns: 1fr; }
      .hero { padding-top: 27px; }
      .match-card:hover { transform: none; }
    }
  </style>
</head>

<body>
  <header>
    <div class="container nav">
      <div class="logo">ALA <span>TV</span></div>
      <button id="langBtn" type="button">Français</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 id="heroTitle">كل المباريات <span>في مكان واحد</span></h1>

    </section>

    <section class="filters">
      <div class="field">
        <label id="dateLabel" for="matchDate">تاريخ المباريات</label>
        <input type="date" id="matchDate">
      </div>

      <div class="field">
        <label id="leagueLabel" for="competition">البطولة</label>
        <select id="competition">

        </select>
      </div>

      <button class="primary-btn" id="searchBtn" type="button">عرض المباريات</button>

    <div class="section-head">
      <h2 id="matchesTitle">المباريات</h2>
      <span class="muted" id="matchCount">0 مباراة</span>

    <section id="matches" class="matches"></section>

      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer id="footerText">ALA TV — تابع جديد مباريات كرة القدم.</footer>

    // شعارات احتياطية للأندية المعروفة.
    const TEAM_LOGO_FALLBACKS = {
      "arsenal": "https://crests.football-data.org/57.png",
      "chelsea": "https://crests.football-data.org/61.png",

    function t(key) {
      return translations[state.language][key] || key;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function firstValue(...values) {
      for (const value of values) {
        if (value === null || value === undefined || value === "") continue;

        if (typeof value === "object" && !Array.isArray(value)) {
          const nested = value.name ?? value.title ?? value.label;
          if (nested !== undefined && nested !== null && nested !== "") {
            return nested;
          }
        } else {
          return value;
        }
      }
      return "";
    }

    function getHome(match) {
      return match.homeTeam || match.home_team || match.home ||
        match.localteam || match.team_home || {};
    }

    function getAway(match) {
      return match.awayTeam || match.away_team || match.away ||
        match.visitorteam || match.team_away || {};
    }

    function getTeamName(team) {
      if (typeof team === "string") {
        return state.language === "ar"
          ? (TEAM_NAMES_AR[team] || team)
          : team;
      }

      const originalName = firstValue(
        team?.name_ar,
        team?.name,
        team?.displayName,
        team?.shortName,
        team?.team_name,
        team?.title
      );

      if (!originalName) return t("unknown");
      if (state.language !== "ar") return String(originalName);

      return team?.name_ar ||
        TEAM_NAMES_AR[String(originalName)] ||
        String(originalName);
    }

    function getTeamCrest(team) {
      if (typeof team === "string" || !team || typeof team !== "object") {
        return "";
      }

      const raw = firstValue(
        team.crest,
        team.logo,
        team.image,
        team.logo_url,
        team.badge,
        team.team_logo,
        team.crestUrl,
        team.img
      );

      // لا نعرض إلا روابط الصور المعتادة.
      if (typeof raw !== "string") return "";
      if (!/^https?:\/\//i.test(raw)) return "";
      return raw;
    }

    function getTeamLogoFallback(team) {
      const rawName = typeof team === "string"
        ? team
        : firstValue(
            team?.name,
            team?.displayName,
            team?.shortName,
            team?.team_name,
            team?.title
          );

      const name = String(rawName || "").trim().toLowerCase();
      return TEAM_LOGO_FALLBACKS[name] || "";
    }

    // شعار SVG محلي احتياطي: لا يعتمد على اتصال خارجي.
    function makeFallbackLogo(teamName) {
      const name = String(teamName || "?").trim();
      const words = name.split(/\s+/).filter(Boolean);
      const initials = words.length > 1
        ? words.slice(0, 2).map(word => word[0]).join("")
        : (name.slice(0, 2) || "?");

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"
             viewBox="0 0 96 96">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">

              <stop offset="100%" stop-color="#33204e"/>
            </linearGradient>

                fill="url(#g)" stroke="#b69aff" stroke-width="3"/>
          <text x="48" y="56" text-anchor="middle"
                font-family="Arial,sans-serif" font-size="30"
                font-weight="700" fill="#ffffff">${escapeHTML(initials)}</text>
        </svg>`;

      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    // إصلاح دالة اسم البطولة التي كانت ناقصة في النسخة المرسلة.
    function competitionName(match) {
      const comp = match.competition || match.league ||
        match.tournament || match.competitionInfo || {};

      const id = String(firstValue(
        comp.id,
        comp.competition_id,
        comp.league_id,
        match.competition_id,
        match.league_id
      ) || "");

      const localized = COMPETITION_NAMES[id];
      if (localized) {
        return localized[state.language] || localized.ar;
      }

      let name = firstValue(
        comp.name_ar,
        comp.name,
        comp.competition_name,
        comp.title,
        comp.displayName,
        match.competition_name,
        match.league_name,
        match.tournament_name,
        comp.code,
        comp.slug
      );

      if (!name && id) name = `comp_${id}`;
      if (!name) return t("unknown");

      name = String(name);

      if (name.startsWith("comp_")) {
        name = name.replace(/^comp_/, "").replace(/_/g, " ");
        name = name.replace(/\b\w/g, char => char.toUpperCase());
      }

      if (state.language === "ar") {
        const aliases = {
          "Premier League": "الدوري الإنجليزي الممتاز",
          "La Liga": "الدوري الإسباني",
          "LALIGA": "الدوري الإسباني",
          "Serie A": "الدوري الإيطالي",
          "Bundesliga": "الدوري الألماني",
          "Ligue 1": "الدوري الفرنسي",
          "UEFA Champions League": "دوري أبطال أوروبا",
          "UEFA Europa League": "الدوري الأوروبي",
          "UEFA Conference League": "دوري المؤتمر الأوروبي",
          "Eredivisie": "الدوري الهولندي",
          "Primeira Liga": "الدوري البرتغالي",
          "Saudi Pro League": "الدوري السعودي",
          "Ligue Professionnelle 1": "الرابطة الجزائرية المحترفة الأولى"
        };

        return aliases[name] || name;
      }

      return name;
    }

    function competitionId(match) {
      const comp = match.competition || match.league ||
        match.tournament || {};

      return String(firstValue(
        comp.id,
        comp.code,
        comp.competition_id,
        comp.slug,
        match.competition_id,
        match.competition_code,
        match.league_id
      ) || "");
    }

    function getKickoff(match) {
      return firstValue(
        match.kickoffAt,
        match.utcDate,
        match.datetime,
        match.starting_at,
        match.date,
        match.match_date,
        match.fixture?.date,
        match.start_time,
        match.time
      );
    }

    function formatTime(match) {
      const raw = getKickoff(match);
      if (!raw) return t("unknown");

      if (typeof raw === "string" && /^\d{1,2}:\d{2}$/.test(raw)) {
        return raw;
      }

      const date = new Date(raw);
      if (Number.isNaN(date.getTime())) return String(raw);

      return new Intl.DateTimeFormat(
        state.language === "ar" ? "ar-DZ" : "fr-FR",
        {
          hour: "2-digit",
          minute: "2-digit",
          timeZone: "Africa/Algiers"
        }
      ).format(date);
    }

    function formatDateTime(match) {
      const raw = getKickoff(match);
      if (!raw) return t("unknown");

      const date = new Date(raw);
      if (Number.isNaN(date.getTime())) return String(raw);

      return new Intl.DateTimeFormat(
        state.language === "ar" ? "ar-DZ" : "fr-FR",
        {
          dateStyle: "medium",
          timeStyle: "short",
          timeZone: "Africa/Algiers"
        }
      ).format(date);
    }

    function getScore(match) {
      const home = firstValue(
        match.homeScore,
        match.home_score,
        match.score?.home,
        match.scores?.home,
        match.goals?.home
      );

      const away = firstValue(
        match.awayScore,
        match.away_score,
        match.score?.away,
        match.scores?.away,
        match.goals?.away
      );

      if (home !== "" && away !== "") return `${home} - ${away}`;

      const score = match.score?.fullTime ||
        match.score?.fulltime ||
        match.score?.full_time;

      if (score && score.home != null && score.away != null) {
        return `${score.home} - ${score.away}`;
      }

      return formatTime(match);
    }

    function getStatus(match) {
      const statusObject = match.fixture?.status || match.status;
      const raw = String(firstValue(
        typeof statusObject === "object"
          ? statusObject.short
          : statusObject,
        match.statusShort,
        match.status_short,
        match.state,
        match.match_status
      ) || "").toLowerCase();

      if (/live|in.play|in_progress|1h|2h|half.time|first.half|second.half|مباشر/.test(raw)) {
        return { label: t("live"), className: "live" };
      }

      if (/finish|ended|full.time|^ft$|complete|after.extra|penalt|انتهت/.test(raw)) {
        return { label: t("finished"), className: "finished" };
      }

      if (/postpon|delay|^pst$|مؤجل/.test(raw)) {
        return { label: t("postponed"), className: "" };
      }

      if (/cancel|abandon|^canc$|ألغ/.test(raw)) {
        return { label: t("cancelled"), className: "" };
      }

      if (/suspend|^abd$|^int$|متوقف/.test(raw)) {
        return { label: t("suspended"), className: "" };
      }

      return { label: t("scheduled"), className: "" };
    }

    function getArray(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data?.matches)) return data.matches;
      if (Array.isArray(data?.fixtures)) return data.fixtures;
      if (Array.isArray(data?.data)) return data.data;
      if (Array.isArray(data?.events)) return data.events;
      if (Array.isArray(data?.response)) return data.response;
      return [];
    }

    function makeMatchKey(match) {
      const home = getTeamName(getHome(match)).toLowerCase();
      const away = getTeamName(getAway(match)).toLowerCase();
      const kickoff = String(getKickoff(match) || "").slice(0, 16);
      const comp = competitionId(match);
      return `${comp}|${home}|${away}|${kickoff}`;
    }

    function normalizeMatches(matches) {
      const unique = new Map();

      for (const match of matches) {
        if (!match || typeof match !== "object") continue;

        const home = getHome(match);
        const away = getAway(match);

        if (!firstValue(
          typeof home === "string" ? home : home?.name,
          home?.name_ar,
          home?.team_name
        )) continue;

        if (!firstValue(
          typeof away === "string" ? away : away?.name,
          away?.name_ar,
          away?.team_name
        )) continue;

        const key = makeMatchKey(match);
        if (!unique.has(key)) unique.set(key, match);
      }

      return [...unique.values()].sort((a, b) => {
        const dateA = new Date(getKickoff(a)).getTime();
        const dateB = new Date(getKickoff(b)).getTime();

        if (Number.isNaN(dateA) && Number.isNaN(dateB)) return 0;
        if (Number.isNaN(dateA)) return 1;
        if (Number.isNaN(dateB)) return -1;

        return dateA - dateB;
      });
    }

    function buildCompetitionOptions(matches) {
      const select = $("competition");
      const current = select.value || "all";
      const competitions = new Map();

      for (const match of matches) {
        const id = competitionId(match);
        const name = competitionName(match);
        const key = id || name;

        if (key && name && !competitions.has(key)) {
          competitions.set(key, name);
        }
      }

      select.replaceChildren();

      const allOption = document.createElement("option");
      allOption.value = "all";
      allOption.textContent = t("allCompetitions");
      select.appendChild(allOption);

      [...competitions.entries()]
        .sort((a, b) => a[1].localeCompare(
          b[1],
          state.language === "ar" ? "ar" : "fr"
        ))
        .forEach(([id, name]) => {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = name;
          select.appendChild(option);
        });

      if ([...select.options].some(option => option.value === current)) {
        select.value = current;
      } else {
        select.value = "all";
      }
    }

    function createTeamLogo(team, teamName) {
      const img = document.createElement("img");
      img.className = "team-logo";
      img.alt = "";
      img.loading = "lazy";
      img.width = 43;
      img.height = 43;

      const source = getTeamCrest(team) || getTeamLogoFallback(team);
      const fallback = makeFallbackLogo(teamName);

      // حتى لو تعطل شعار المصدر والشعار الاحتياطي، يظهر شعار SVG محلي.
      img.addEventListener("error", () => {
        if (img.dataset.fallbackApplied === "true") return;

        img.dataset.fallbackApplied = "true";
        img.src = fallback;
      });

      img.src = source || fallback;
      return img;
    }

    function renderMatches(matches) {
      const container = $("matches");
      container.replaceChildren();

      if (!matches.length) {
        $("message").style.display = "block";
        $("message").textContent = t("noMatches");
        $("matchCount").textContent = `0 ${t("matchCount")}`;
        return;
      }

      $("message").style.display = "none";
      $("matchCount").textContent = `${matches.length} ${t("matchCount")}`;

      matches.forEach((match, index) => {
        const home = getHome(match);
        const away = getAway(match);
        const homeName = getTeamName(home);
        const awayName = getTeamName(away);
        const status = getStatus(match);

        // إصلاح الخطأ: تعريف card مرة واحدة فقط.
        const card = document.createElement("article");
        card.className = "match-card";

        const league = document.createElement("div");
        league.className = "league";

        const leagueName = document.createElement("span");
        leagueName.textContent = competitionName(match);

        const kickoff = document.createElement("span");
        kickoff.textContent = formatTime(match);

        league.append(leagueName, kickoff);

        const teams = document.createElement("div");
        teams.className = "teams";

        const homeTeam = document.createElement("div");
        homeTeam.className = "team";
        homeTeam.appendChild(createTeamLogo(home, homeName));

        const homeLabel = document.createElement("div");
        homeLabel.className = "team-name";
        homeLabel.textContent = homeName;
        homeTeam.appendChild(homeLabel);

        const center = document.createElement("div");

        const score = document.createElement("div");
        score.className = "score";
        score.textContent = getScore(match);

        const matchTime = document.createElement("div");
        matchTime.className = "match-time";
        matchTime.textContent = status.label;

        center.append(score, matchTime);

        const awayTeam = document.createElement("div");
        awayTeam.className = "team";
        awayTeam.appendChild(createTeamLogo(away, awayName));

        const awayLabel = document.createElement("div");
        awayLabel.className = "team-name";
        awayLabel.textContent = awayName;
        awayTeam.appendChild(awayLabel);

        teams.append(homeTeam, center, awayTeam);

        const bottom = document.createElement("div");
        bottom.className = "match-bottom";

        const statusElement = document.createElement("span");
        statusElement.className = `status ${status.className}`;
        statusElement.textContent = status.label;

        const detailsButton = document.createElement("button");
        detailsButton.className = "details-btn";
        detailsButton.type = "button";
        detailsButton.textContent = t("details");
        detailsButton.setAttribute("aria-label", `${t("details")}: ${homeName} - ${awayName}`);
        detailsButton.addEventListener("click", () => openMatchDetails(match));

        bottom.append(statusElement, detailsButton);
        card.append(league, teams, bottom);
        container.appendChild(card);
      });
    }

    function extractNames(value) {
      // بعض المصادر تعيد التشكيلة داخل object يحتوي على players أو squad.
      if (!Array.isArray(value) && value && typeof value === "object") {
        value = value.players || value.squad || value.startXI || value.startingXI || [];
      }

      if (!Array.isArray(value)) return [];

      return value.map(player => {
        if (typeof player === "string") return player;

        const nestedPlayer = player.player || {};

        const name = firstValue(
          player.name,
          player.player_name,
          player.displayName,
          player.full_name,
          nestedPlayer.common_name,
          nestedPlayer.name
        );

        const position = firstValue(
          player.positionName,
          player.position_name,
          player.position,
          player.pos,
          player.role,
          nestedPlayer.position
        );

        if (!name) return "";

        return position ? `${name} — ${position}` : name;
      }).filter(Boolean);
    }

    function getLineup(match, side) {
      const lineup = match.lineups || match.lineup || {};
      const team = side === "home" ? getHome(match) : getAway(match);

      const possible = side === "home"
        ? [
            match.homeLineup,
            match.home_lineup,
            match.home_players,
            lineup.home,
            lineup.homeTeam,
            lineup.home_team,
            team.lineup,
            team.players
          ]
        : [
            match.awayLineup,
            match.away_lineup,
            match.away_players,
            lineup.away,
            lineup.awayTeam,
            lineup.away_team,
            team.lineup,
            team.players
          ];

      for (const item of possible) {
        const names = extractNames(item);
        if (names.length) return names;
      }

      return [];
    }

    function getChannels(match) {
      const possible = [
        match.broadcast,
        match.broadcasts,
        match.channels,
        match.tvChannels,
        match.tv_channels,
        match.broadcasting,
        match.tv,
        match.television
      ];

      for (const item of possible) {
        if (!item) continue;

        const values = Array.isArray(item) ? item : [item];

        const names = values.map(channel => {
          if (typeof channel === "string") return channel;

          return firstValue(
            channel.name,
            channel.title,
            channel.channel_name,
            channel.displayName,
            channel.channel
          );
        }).filter(Boolean);

        if (names.length) return [...new Set(names)];
      }

      return [];
    }

    function getVenue(match) {
      return firstValue(
        match.venue?.name,
        match.venue,
        match.stadium?.name,
        match.stadium,
        match.ground,
        match.venue_name,
        match.stadium_name,
        match.fixture?.venue?.name
      );
    }

    function getReferee(match) {
      const value = firstValue(
        match.referee?.name,
        match.referee,
        match.referee_name,
        match.officials?.referee
      );

      if (value) return value;

      if (Array.isArray(match.referees) && match.referees.length) {
        const main = match.referees[0];
        return firstValue(main.name, main.full_name, main);
      }

      return "";
    }

    function detailRow(label, value) {
      const row = document.createElement("div");
      row.className = "detail-row";

      const labelElement = document.createElement("span");
      labelElement.textContent = label;

      const valueElement = document.createElement("span");
      valueElement.textContent = value || t("unknown");

      row.append(labelElement, valueElement);
      return row;
    }

    function renderLineup(title, names, emptyMessage) {
      const box = document.createElement("div");
      box.className = "lineup-team";

      const heading = document.createElement("h4");
      heading.textContent = title;
      box.appendChild(heading);

      if (!names.length) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = emptyMessage;
        box.appendChild(empty);
        return box;
      }

      const list = document.createElement("ul");

      names.forEach(name => {
        const item = document.createElement("li");
        item.textContent = name;
        list.appendChild(item);
      });

      box.appendChild(list);
      return box;
    }

    function openMatchDetails(match) {
      const homeName = getTeamName(getHome(match));
      const awayName = getTeamName(getAway(match));
      const channels = getChannels(match);
      const homeLineup = getLineup(match, "home");
      const awayLineup = getLineup(match, "away");

      $("modalTitle").textContent = `${homeName} ${t("vs")} ${awayName}`;

      const body = $("modalBody");
      body.replaceChildren();

      body.append(
        detailRow(t("competition"), competitionName(match)),
        detailRow(t("dateTime"), formatDateTime(match)),
        detailRow(t("stadium"), getVenue(match)),
        detailRow(t("referee"), getReferee(match))
      );

      const channelSection = document.createElement("section");
      channelSection.className = "detail-section";

      const channelHeading = document.createElement("h3");
      channelHeading.textContent = t("channels");
      channelSection.appendChild(channelHeading);

      const channelList = document.createElement("div");
      channelList.className = "channel-list";

      if (channels.length) {
        channels.forEach(channel => {
          const item = document.createElement("span");
          item.className = "channel";
          item.textContent = channel;
          channelList.appendChild(item);
        });
      } else {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = t("noChannels");
        channelList.appendChild(empty);
      }

      channelSection.appendChild(channelList);
      body.appendChild(channelSection);

      const lineupSection = document.createElement("section");
      lineupSection.className = "detail-section";

      const lineupHeading = document.createElement("h3");
      lineupHeading.textContent = t("homeLineup") + " / " + t("awayLineup");
      lineupSection.appendChild(lineupHeading);

      const lineupList = document.createElement("div");
      lineupList.className = "lineup-list";

      lineupList.append(
        renderLineup(homeName, homeLineup, t("noLineup")),
        renderLineup(awayName, awayLineup, t("noLineup"))
      );

      lineupSection.appendChild(lineupList);
      body.appendChild(lineupSection);

      $("matchModal").classList.add("show");
      $("closeModal").focus();
    }

    function applyCompetitionFilter() {
      const selected = $("competition").value;

      const filtered = !selected || selected === "all"
        ? state.allMatches
        : state.allMatches.filter(match => {
            const id = competitionId(match);
            const name = competitionName(match);
            return id === selected || name === selected;
          });

      state.matches = filtered;
      renderMatches(filtered);
    }

    async function loadMatches() {
      const requestId = ++state.requestId;

      state.loading = true;
      $("searchBtn").disabled = true;
      $("message").style.display = "block";
      $("message").textContent = t("loading");
      $("matches").replaceChildren();

      const date = $("matchDate").value;

      if (!date) {
        $("message").textContent = t("error");
        $("searchBtn").disabled = false;
        state.loading = false;
        return;
      }

      try {
        const params = new URLSearchParams({ date });

        // نطلب كل البطولات من الخادم ثم نطبق الفلترة محليًا.
        // هذا يسمح للقائمة بعرض جميع البطولات المتوفرة لذلك التاريخ.
        const response = await fetch(
          `${API_BASE}/all-fixtures?${params.toString()}`,
          {
            method: "GET",
            headers: { "Accept": "application/json" }
          }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (requestId !== state.requestId) return;

        const allMatches = normalizeMatches(getArray(data));

        state.allMatches = allMatches;
        buildCompetitionOptions(allMatches);
        applyCompetitionFilter();

        if (data && data.partial === true &&
            Array.isArray(data.warnings) && data.warnings.length) {
          $("message").style.display = "block";
          $("message").textContent =
            `${t("partialWarning")}: ${data.warnings.join(" · ")}`;
        }
      } catch (error) {
        if (requestId !== state.requestId) return;

        console.error("ALA TV: failed to load fixtures", error);
        $("message").style.display = "block";
        $("message").textContent = t("error");
        $("matches").replaceChildren();
        $("matchCount").textContent = `0 ${t("matchCount")}`;
      } finally {
        if (requestId === state.requestId) {
          state.loading = false;
          $("searchBtn").disabled = false;
        }
      }
    }

    function applyLanguage() {
      const isArabic = state.language === "ar";

      document.documentElement.lang = isArabic ? "ar" : "fr";
      document.documentElement.dir = isArabic ? "rtl" : "ltr";

      $("heroTitle").innerHTML = t("heroTitle");
      $("heroText").textContent = t("heroText");
      $("dateLabel").textContent = t("dateLabel");
      $("leagueLabel").textContent = t("leagueLabel");
      $("searchBtn").textContent = t("searchBtn");
      $("matchesTitle").textContent = t("matchesTitle");
      $("langBtn").textContent = t("languageButton");
      $("footerText").textContent = t("footer");

      buildCompetitionOptions(state.allMatches);
      applyCompetitionFilter();

      if ($("matchModal").classList.contains("show")) {
        $("closeModal").setAttribute(
          "aria-label",
          isArabic ? "إغلاق" : "Fermer"
        );
      }
    }

    function localDateString() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Africa/Algiers",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const get = type => parts.find(part => part.type === type)?.value;
      return `${get("year")}-${get("month")}-${get("day")}`;
    }

    $("searchBtn").addEventListener("click", loadMatches);

    $("competition").addEventListener("change", applyCompetitionFilter);

    $("matchDate").addEventListener("change", loadMatches);

    $("langBtn").addEventListener("click", () => {
      state.language = state.language === "ar" ? "fr" : "ar";
      applyLanguage();
    });

    $("closeModal").addEventListener("click", () => {
      $("matchModal").classList.remove("show");
    });

    $("matchModal").addEventListener("click", event => {
      if (event.target === $("matchModal")) {
        $("matchModal").classList.remove("show");
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        $("matchModal").classList.remove("show");
      }
    });

    $("matchDate").value = localDateString();
    applyLanguage();
    loadMatches();
  </script>
</body>
</html>
