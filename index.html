
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090611">
  <meta name="description" content="ALA TV - تابع مباريات كرة القدم ومواعيدها ونتائجها وتفاصيلها.">
  <title>ALA TV | مباريات اليوم</title>

  <style>
    :root {
      --bg: #090611;
      --panel: #130e20;
      --panel2: #1b1430;
      --purple: #8b5cf6;
      --purple2: #6d28d9;
      --text: #f7f4ff;
      --muted: #a9a0bb;
      --border: #302343;
      --green: #35d49a;
      --red: #ff6b81;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at top, #21113b 0%, var(--bg) 52%);
      font-family: Arial, Tahoma, sans-serif;
      min-height: 100vh;
    }

    button, input, select { font: inherit; }

    button {
      cursor: pointer;
      border: 0;
    }

    .container {
      width: min(1150px, 94%);
      margin: auto;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(9, 6, 17, .88);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(14px);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span { color: var(--purple); }

    .nav button, .secondary-btn {
      color: white;
      background: var(--panel2);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
    }

    .hero {
      text-align: center;
      padding: 35px 0 24px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 5vw, 40px);
    }

    .hero h1 span { color: #b69aff; }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      margin: 22px 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(19, 14, 32, .88);
    }

    .field label {
      display: block;
      color: var(--muted);
      margin-bottom: 8px;
      font-size: 13px;
    }

    .field input, .field select {
      width: 100%;
      min-height: 44px;
      color: white;
      background: #0d0916;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      outline: none;
    }

    .field select option { background: #130e20; }

    .primary-btn {
      align-self: end;
      min-height: 44px;
      padding: 10px 20px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 25px 0 15px;
    }

    .section-head h2 {
      font-size: 20px;
      margin: 0;
    }

    .muted { color: var(--muted); font-size: 13px; }

    .status-message {
      text-align: center;
      padding: 30px 12px;
      border: 1px dashed var(--border);
      border-radius: 15px;
      background: rgba(19, 14, 32, .6);
      color: var(--muted);
      line-height: 1.9;
    }

    .matches {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding-bottom: 40px;
    }

    .match-card {
      background: linear-gradient(145deg, #171026, #100b1b);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      transition: .2s;
    }

    .match-card:hover {
      border-color: #7651bd;
      transform: translateY(-2px);
    }

    .league {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #c5b5f0;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      text-align: center;
    }

    .team { min-width: 0; }

    .team img {
      width: 43px;
      height: 43px;
      object-fit: contain;
      display: block;
      margin: 0 auto 9px;
    }

    .team-name {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .score {
      font-size: 21px;
      font-weight: 900;
      white-space: nowrap;
    }

    .match-time {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .match-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .status {
      color: var(--muted);
      font-size: 12px;
    }

    .status.live { color: var(--red); }
    .status.finished { color: var(--green); }

    .details-btn {
      padding: 8px 12px;
      border-radius: 9px;
      color: white;
      background: #33204e;
      border: 1px solid #493267;
      font-size: 12px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(0, 0, 0, .78);
      padding: 18px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .modal-content {
      width: min(700px, 100%);
      margin: auto;
      background: #110c1d;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .modal-head h2 { font-size: 20px; margin: 0; }

    .close-btn {
      color: white;
      background: #30213f;
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      line-height: 1.7;
    }

    .detail-row span:first-child { color: var(--muted); }
    .detail-row span:last-child { text-align: left; overflow-wrap: anywhere; }

    .detail-section { margin-top: 22px; }

    .detail-section h3 {
      font-size: 16px;
      color: #c7b4ff;
    }

    .channel-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .channel {
      padding: 8px 11px;
      background: #211634;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 13px;
    }

    .lineup-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .lineup-team {
      background: #171026;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .lineup-team h4 { margin: 0 0 10px; }
    .lineup-team ul { margin: 0; padding-right: 20px; color: #ded6ed; }
    .lineup-team li { margin: 7px 0; font-size: 13px; }

    footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      padding: 25px 10px;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .filters { grid-template-columns: 1fr; }
      .matches { grid-template-columns: 1fr; }
      .nav { min-height: 62px; }
      .logo { font-size: 23px; }
      .lineup-list { grid-template-columns: 1fr; }
      .hero { padding-top: 27px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="container nav">
      <div class="logo">ALA <span>TV</span></div>
      <button id="langBtn" type="button">Français</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 id="heroTitle">كل المباريات <span>في مكان واحد</span></h1>
      <p id="heroText">تابع مواعيد مباريات كرة القدم ونتائجها وتفاصيلها بسهولة.</p>
    </section>

    <section class="filters">
      <div class="field">
        <label id="dateLabel" for="matchDate">تاريخ المباريات</label>
        <input type="date" id="matchDate">
      </div>

      <div class="field">
        <label id="leagueLabel" for="competition">البطولة</label>
        <select id="competition">
          <option value="all">كل البطولات</option>
        </select>
      </div>

      <button class="primary-btn" id="searchBtn" type="button">عرض المباريات</button>
    </section>

    <div class="section-head">
      <h2 id="matchesTitle">المباريات</h2>
      <span class="muted" id="matchCount">0 مباراة</span>
    </div>

    <div id="message" class="status-message">جاري تحميل المباريات...</div>
    <section id="matches" class="matches"></section>
  </main>

  <div id="matchModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="modal-head">
        <h2 id="modalTitle">تفاصيل المباراة</h2>
        <button class="close-btn" id="closeModal" type="button" aria-label="إغلاق">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer id="footerText">ALA TV — تابع جديد مباريات كرة القدم.</footer>

  <script>
    "use strict";

    const API_BASE = "https://ala-tv-api.lyanita000.workers.dev";

    const $ = (id) => document.getElementById(id);

    const state = {
      matches: [],
      language: "ar",
      loading: false
    };

    const translations = {
      ar: {
        heroTitle: 'كل المباريات <span>في مكان واحد</span>',
        heroText: "تابع مواعيد مباريات كرة القدم ونتائجها وتفاصيلها بسهولة.",
        dateLabel: "تاريخ المباريات",
        leagueLabel: "البطولة",
        searchBtn: "عرض المباريات",
        matchesTitle: "المباريات",
        allCompetitions: "كل البطولات",
        loading: "جاري تحميل المباريات...",
        noMatches: "ما لقيناش مباريات لهذا التاريخ أو البطولة.",
        error: "تعذر تحميل المباريات. تأكد من اتصال الإنترنت وحاول مجددًا.",
        matchCount: "مباراة",
        details: "التفاصيل",
        vs: "ضد",
        scheduled: "لم تبدأ",
        live: "مباشرة",
        finished: "انتهت",
        postponed: "مؤجلة",
        cancelled: "أُلغيت",
        unknown: "غير متوفر",
        detailsTitle: "تفاصيل المباراة",
        competition: "البطولة",
        dateTime: "التاريخ والتوقيت",
        stadium: "الملعب",
        referee: "الحكم",
        channels: "القنوات الناقلة",
        homeLineup: "تشكيلة الفريق الأول",
        awayLineup: "تشكيلة الفريق الثاني",
        noLineup: "التشكيلة غير متوفرة من المصدر.",
        noChannels: "لا توجد قنوات ناقلة متاحة من المصدر.",
        footer: "ALA TV — تابع جديد مباريات كرة القدم.",
        languageButton: "Français"
      },
      fr: {
        heroTitle: 'Tous les matchs <span>au même endroit</span>',
        heroText: "Consultez les horaires, résultats et détails des matchs de football.",
        dateLabel: "Date des matchs",
        leagueLabel: "Compétition",
        searchBtn: "Afficher les matchs",
        matchesTitle: "Matchs",
        allCompetitions: "Toutes les compétitions",
        loading: "Chargement des matchs...",
        noMatches: "Aucun match trouvé pour cette date ou compétition.",
        error: "Impossible de charger les matchs. Vérifiez votre connexion.",
        matchCount: "match(s)",
        details: "Détails",
        vs: "contre",
        scheduled: "À venir",
        live: "En direct",
        finished: "Terminé",
        postponed: "Reporté",
        cancelled: "Annulé",
        unknown: "Non disponible",
        detailsTitle: "Détails du match",
        competition: "Compétition",
        dateTime: "Date et heure",
        stadium: "Stade",
        referee: "Arbitre",
        channels: "Chaînes TV",
        homeLineup: "Composition — équipe 1",
        awayLineup: "Composition — équipe 2",
        noLineup: "Composition non disponible.",
        noChannels: "Aucune chaîne disponible depuis la source.",
        footer: "ALA TV — Toute l'actualité du football.",
        languageButton: "العربية"
      }
    };

    function t(key) {
      return translations[state.language][key] || key;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function firstValue(...values) {
      for (const value of values) {
        if (value === null || value === undefined || value === "") continue;
        if (typeof value === "object" && !Array.isArray(value)) {
          if (value.name) return value.name;
          if (value.title) return value.title;
          if (value.label) return value.label;
        } else {
          return value;
        }
      }
      return "";
    }

    function getHome(match) {
      return match.homeTeam || match.home_team || match.home ||
        match.localteam || match.team_home || {};
    }

    function getAway(match) {
      return match.awayTeam || match.away_team || match.away ||
        match.visitorteam || match.team_away || {};
    }

    function getTeamName(team) {
      if (typeof team === "string") return team;
      return firstValue(team?.name, team?.displayName, team?.shortName,
        team?.team_name, team?.title, team?.name_ar) || t("unknown");
    }

    function getTeamCrest(team) {
      if (!team || typeof team !== "object") return "";
      return firstValue(team.crest, team.logo, team.image, team.logo_url,
        team.badge, team.team_logo, team.crestUrl);
    }

    function competitionName(match) {
      const comp = match.competition || match.league || match.tournament || {};
      let name = typeof comp === "string"
        ? comp
        : firstValue(comp.name, comp.title, comp.displayName, comp.competition_name);

      name = name || firstValue(match.competition_name, match.league_name, match.tournament_name);

      const known = {
        "comp_ligue_1_fr": "الدوري الفرنسي",
        "comp_premier_league_eng": "الدوري الإنجليزي",
        "comp_la_liga_es": "الدوري الإسباني",
        "comp_serie_a_it": "الدوري الإيطالي",
        "comp_bundesliga_de": "الدوري الألماني",
        "comp_ligue_1": "الدوري الفرنسي",
        "comp_premier_league": "الدوري الإنجليزي",
        "comp_la_liga": "الدوري الإسباني",
        "comp_serie_a": "الدوري الإيطالي"
      };

      if (known[name]) return known[name];

      if (name && name.startsWith("comp_")) {
        const cleaned = name.replace(/^comp_/, "").replace(/_/g, " ");
        return cleaned.replace(/\b\w/g, c => c.toUpperCase());
      }

      return name || t("unknown");
    }

    function competitionId(match) {
      const comp = match.competition || match.league || match.tournament || {};
      return String(firstValue(
        comp.id, comp.code, comp.competition_id, comp.slug,
        match.competition_id, match.competition_code, match.league_id
      ) || "");
    }

    function getKickoff(match) {
      return firstValue(
        match.kickoffAt, match.utcDate, match.datetime, match.starting_at,
        match.date, match.match_date, match.fixture?.date,
        match.start_time, match.time
      );
    }

    function formatTime(match) {
      const raw = getKickoff(match);
      if (!raw) return t("unknown");

      if (typeof raw === "string" && /^\d{1,2}:\d{2}$/.test(raw)) return raw;

      const date = new Date(raw);
      if (Number.isNaN(date.getTime())) return String(raw);

      return new Intl.DateTimeFormat(state.language === "ar" ? "ar-DZ" : "fr-FR", {
        hour: "2-digit",
        minute: "2-digit",
        timeZone: "Africa/Algiers"
      }).format(date);
    }

    function formatDateTime(match) {
      const raw = getKickoff(match);
      if (!raw) return t("unknown");

      const date = new Date(raw);
      if (Number.isNaN(date.getTime())) return String(raw);

      return new Intl.DateTimeFormat(state.language === "ar" ? "ar-DZ" : "fr-FR", {
        dateStyle: "medium",
        timeStyle: "short",
        timeZone: "Africa/Algiers"
      }).format(date);
    }

    function getScore(match) {
      const home = firstValue(match.homeScore, match.home_score,
        match.score?.home, match.scores?.home, match.goals?.home);
      const away = firstValue(match.awayScore, match.away_score,
        match.score?.away, match.scores?.away, match.goals?.away);

      if (home !== "" && away !== "") return `${home} - ${away}`;

      const score = match.score?.fullTime || match.score?.fulltime;
      if (score && score.home != null && score.away != null) {
        return `${score.home} - ${score.away}`;
      }

      return formatTime(match);
    }

    function getStatus(match) {
      const raw = String(firstValue(
        match.status, match.state, match.match_status, match.fixture?.status
      ) || "").toLowerCase();

      if (/live|in.play|in_progress|1h|2h|half.time|first.half|second.half|مباشر/.test(raw)) {
        return { label: t("live"), className: "live" };
      }

      if (/finish|ended|full.time|ft|complete|after.extra|penalt|انتهت/.test(raw)) {
        return { label: t("finished"), className: "finished" };
      }

      if (/postpon|delay|مؤجل/.test(raw)) {
        return { label: t("postponed"), className: "" };
      }

      if (/cancel|abandon|ألغ/.test(raw)) {
        return { label: t("cancelled"), className: "" };
      }

      return { label: t("scheduled"), className: "" };
    }

    function getArray(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data?.matches)) return data.matches;
      if (Array.isArray(data?.fixtures)) return data.fixtures;
      if (Array.isArray(data?.data)) return data.data;
      if (Array.isArray(data?.events)) return data.events;
      return [];
    }

    function makeMatchKey(match) {
      const home = getTeamName(getHome(match)).toLowerCase();
      const away = getTeamName(getAway(match)).toLowerCase();
      const kickoff = String(getKickoff(match) || "").slice(0, 16);
      return `${home}|${away}|${kickoff}`;
    }

    function normalizeMatches(matches) {
      const unique = new Map();

      for (const match of matches) {
        if (!match || typeof match !== "object") continue;
        if (!getTeamName(getHome(match)) || !getTeamName(getAway(match))) continue;

        const key = makeMatchKey(match);
        if (!unique.has(key)) unique.set(key, match);
      }

      return [...unique.values()].sort((a, b) => {
        const dateA = new Date(getKickoff(a)).getTime();
        const dateB = new Date(getKickoff(b)).getTime();
        if (Number.isNaN(dateA)) return 1;
        if (Number.isNaN(dateB)) return -1;
        return dateA - dateB;
      });
    }

    function buildCompetitionOptions(matches) {
      const select = $("competition");
      const current = select.value || "all";
      const competitions = new Map();

      for (const match of matches) {
        const id = competitionId(match);
        const name = competitionName(match);
        const key = id || name;

        if (key && name && !competitions.has(key)) {
          competitions.set(key, name);
        }
      }

      select.innerHTML = `<option value="all">${escapeHTML(t("allCompetitions"))}</option>`;

      [...competitions.entries()]
        .sort((a, b) => a[1].localeCompare(b[1], state.language === "ar" ? "ar" : "fr"))
        .forEach(([id, name]) => {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = name;
          select.appendChild(option);
        });

      if ([...select.options].some(option => option.value === current)) {
        select.value = current;
      } else {
        select.value = "all";
      }
    }

    function renderMatches(matches) {
      const container = $("matches");
      container.innerHTML = "";

      if (!matches.length) {
        $("message").style.display = "block";
        $("message").textContent = t("noMatches");
        $("matchCount").textContent = `0 ${t("matchCount")}`;
        return;
      }

      $("message").style.display = "none";
      $("matchCount").textContent = `${matches.length} ${t("matchCount")}`;

      matches.forEach((match, index) => {
        const home = getHome(match);
        const away = getAway(match);
        const homeName = getTeamName(home);
        const awayName = getTeamName(away);
        const homeLogo = getTeamCrest(home);
        const awayLogo = getTeamCrest(away);
        const status = getStatus(match);
        const matchId = String(firstValue(match.id, match.fixture_id, match.match_id) || index);

        const card = document.createElement("article");
        card.className = "match-card";

        card.innerHTML = `
          <div class="league">
            <span>${escapeHTML(competitionName(match))}</span>
            <span>${escapeHTML(formatTime(match))}</span>
          </div>

          <div class="teams">
            <div class="team">
              ${homeLogo ? `<img src="${escapeHTML(homeLogo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ""}
              <div class="team-name">${escapeHTML(homeName)}</div>
            </div>

            <div>
              <div class="score">${escapeHTML(getScore(match))}</div>
              <div class="match-time">${escapeHTML(status.label)}</div>
            </div>

            <div class="team">
              ${awayLogo ? `<img src="${escapeHTML(awayLogo)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ""}
              <div class="team-name">${escapeHTML(awayName)}</div>
            </div>
          </div>

          <div class="match-bottom">
            <span class="status ${status.className}">${escapeHTML(status.label)}</span>
            <button class="details-btn" type="button">${escapeHTML(t("details"))}</button>
          </div>
        `;

        card.querySelector(".details-btn").addEventListener("click", () => {
          openMatchDetails(match);
        });

        container.appendChild(card);
      });
    }

    function extractNames(value) {
      if (!Array.isArray(value)) return [];

      return value.map(player => {
        if (typeof player === "string") return player;

        const name = firstValue(
          player.name, player.player_name, player.displayName,
          player.full_name, player.player?.name
        );

        const position = firstValue(
          player.position, player.pos, player.role, player.player?.position
        );

        if (!name) return "";
        return position ? `${name} — ${position}` : name;
      }).filter(Boolean);
    }

    function getLineup(match, side) {
      const lineup = match.lineups || match.lineup || {};
      const team = side === "home" ? getHome(match) : getAway(match);

      const possible = side === "home"
        ? [
            match.homeLineup, match.home_lineup, match.home_players,
            lineup.home, lineup.homeTeam, lineup.home_team,
            team.lineup, team.players
          ]
        : [
            match.awayLineup, match.away_lineup, match.away_players,
            lineup.away, lineup.awayTeam, lineup.away_team,
            team.lineup, team.players
          ];

      for (const item of possible) {
        const names = extractNames(item);
        if (names.length) return names;
      }

      return [];
    }

    function getChannels(match) {
      const possible = [
        match.broadcast, match.broadcasts, match.channels,
        match.tvChannels, match.tv_channels, match.broadcasting,
        match.tv, match.television
      ];

      for (const item of possible) {
        if (!item) continue;

        const values = Array.isArray(item) ? item : [item];
        const names = values.map(channel => {
          if (typeof channel === "string") return channel;
          return firstValue(channel.name, channel.title, channel.channel_name,
            channel.displayName, channel.channel);
        }).filter(Boolean);

        if (names.length) return [...new Set(names)];
      }

      return [];
    }

    function getVenue(match) {
      return firstValue(
        match.venue?.name, match.venue, match.stadium?.name,
        match.stadium, match.ground, match.venue_name, match.stadium_name
      );
    }

    function getReferee(match) {
      const value = firstValue(match.referee?.name, match.referee,
        match.referee_name, match.officials?.referee);

      if (value) return value;

      if (Array.isArray(match.referees) && match.referees.length) {
        const main = match.referees[0];
        return firstValue(main.name, main.full_name, main);
      }

      return "";
    }

    function detailRow(label, value) {
      return `
        <div class="detail-row">
          <span>${escapeHTML(label)}</span>
          <span>${escapeHTML(value || t("unknown"))}</span>
        </div>
      `;
    }

    function renderLineup(title, names, emptyMessage) {
      const content = names.length
        ? `<ul>${names.map(name => `<li>${escapeHTML(name)}</li>`).join("")}</ul>`
        : `<p class="muted">${escapeHTML(emptyMessage)}</p>`;

      return `<div class="lineup-team"><h4>${escapeHTML(title)}</h4>${content}</div>`;
    }

    function openMatchDetails(match) {
      const homeName = getTeamName(getHome(match));
      const awayName = getTeamName(getAway(match));
      const channels = getChannels(match);
      const homeLineup = getLineup(match, "home");
      const awayLineup = getLineup(match, "away");

      $("modalTitle").textContent = `${homeName} ${t("vs")} ${awayName}`;

      const channelHTML = channels.length
        ? channels.map(channel => `<span class="channel">${escapeHTML(channel)}</span>`).join("")
        : `<p class="muted">${escapeHTML(t("noChannels"))}</p>`;

      $("modalBody").innerHTML = `
        ${detailRow(t("competition"), competitionName(match))}
        ${detailRow(t("dateTime"), formatDateTime(match))}
        ${detailRow(t("stadium"), getVenue(match))}
        ${detailRow(t("referee"), getReferee(match))}

        <section class="detail-section">
          <h3>${escapeHTML(t("channels"))}</h3>
          <div class="channel-list">${channelHTML}</div>
        </section>

        <section class="detail-section">
          <h3>${escapeHTML(t("homeLineup"))}</h3>
          <div class="lineup-list">
            ${renderLineup(homeName, homeLineup, t("noLineup"))}
            ${renderLineup(awayName, awayLineup, t("noLineup"))}
          </div>
        </section>
      `;

      $("matchModal").classList.add("show");
    }

    async function loadMatches() {
      if (state.loading) return;

      state.loading = true;
      $("message").style.display = "block";
      $("message").textContent = t("loading");
      $("matches").innerHTML = "";

      const date = $("matchDate").value;
      const selectedCompetition = $("competition").value;

      try {
        // المصدر الجديد يجمع المباريات من المصدرين في استجابة واحدة.
        const params = new URLSearchParams({ date });

        if (selectedCompetition && selectedCompetition !== "all") {
          params.set("competition", selectedCompetition);
        }

        const response = await fetch(
          `${API_BASE}/all-fixtures?${params.toString()}`,
          { method: "GET", headers: { "Accept": "application/json" } }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        let matches = normalizeMatches(getArray(data));

        // بعض استجابات الـ API قد تعيد أسماء أو معرفات مختلفة للبطولات.
        if (selectedCompetition && selectedCompetition !== "all") {
          matches = matches.filter(match => {
            const id = competitionId(match);
            const name = competitionName(match);
            return id === selectedCompetition || name === selectedCompetition;
          });
        }

        state.matches = matches;
        buildCompetitionOptions(normalizeMatches(getArray(data)));

        // إعادة تطبيق اختيار البطولة بعد تحديث القائمة.
        if (selectedCompetition &&
            [...$("competition").options].some(option => option.value === selectedCompetition)) {
          $("competition").value = selectedCompetition;
        }

        renderMatches(matches);

        if (data && data.partial === true && data.warnings?.length) {
          $("message").style.display = "block";
          $("message").textContent = data.warnings.join(" · ");
          if (matches.length) {
            $("message").style.marginBottom = "14px";
          }
        }
      } catch (error) {
        console.error("ALA TV: failed to load fixtures", error);
        $("message").style.display = "block";
        $("message").textContent = t("error");
        $("matchCount").textContent = `0 ${t("matchCount")}`;
      } finally {
        state.loading = false;
      }
    }

    function applyLanguage() {
      const isArabic = state.language === "ar";

      document.documentElement.lang = isArabic ? "ar" : "fr";
      document.documentElement.dir = isArabic ? "rtl" : "ltr";

      $("heroTitle").innerHTML = t("heroTitle");
      $("heroText").textContent = t("heroText");
      $("dateLabel").textContent = t("dateLabel");
      $("leagueLabel").textContent = t("leagueLabel");
      $("searchBtn").textContent = t("searchBtn");
      $("matchesTitle").textContent = t("matchesTitle");
      $("langBtn").textContent = t("languageButton");
      $("footerText").textContent = t("footer");
      $("modalTitle").textContent = t("detailsTitle");

      buildCompetitionOptions(state.matches);
      renderMatches(state.matches);
    }

    function localDateString() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Africa/Algiers",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const get = type => parts.find(part => part.type === type)?.value;
      return `${get("year")}-${get("month")}-${get("day")}`;
    }

    $("searchBtn").addEventListener("click", loadMatches);

    $("competition").addEventListener("change", loadMatches);

    $("matchDate").addEventListener("change", loadMatches);

    $("langBtn").addEventListener("click", () => {
      state.language = state.language === "ar" ? "fr" : "ar";
      applyLanguage();
    });

    $("closeModal").addEventListener("click", () => {
      $("matchModal").classList.remove("show");
    });

    $("matchModal").addEventListener("click", event => {
      if (event.target === $("matchModal")) {
        $("matchModal").classList.remove("show");
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        $("matchModal").classList.remove("show");
      }
    });

    $("matchDate").value = localDateString();
    applyLanguage();
    loadMatches();
  </script>
</body>
</html>
